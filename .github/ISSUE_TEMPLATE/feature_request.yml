name: Feature request
description: Suggest a focused improvement to Flappy Codex
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user experience would this improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or different approaches.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps plain `codex` behavior unchanged.
          required: true
